# Testler için yerel Postgres (CI'daki servis ile aynı imaj).
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/repomind_test pytest
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repomind_test
    ports:
      # Yalnızca bu makineden erişilebilir; 5433: yerelde kurulu bir Postgres ile çakışmasın
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repomind_test"]
      interval: 2s
      timeout: 3s
      retries: 20
