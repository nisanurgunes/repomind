[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib
asyncio_mode = auto
# Tüm async test ve fixture'lar tek event loop paylaşır: app'in modül seviyesindeki
# SQLAlchemy engine'i (asyncpg bağlantı havuzu) tek bir loop'a bağlı kalmalı.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
