name: CI

# Her PR'da ve staging/main'e her push'ta çalışır. Branch protection ile birlikte
# kullanıldığında bu kontroller geçmeden PR merge edilemez.
on:
  pull_request:
  push:
    branches: [main, staging]

# Aynı branch'e yeni bir push gelirse eski çalıştırmayı iptal et
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Canlıdaki gibi pgvector eklentili Postgres. Her çalıştırmada boş başlar.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repomind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d repomind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/repomind_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/repomind_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # backend/Dockerfile ile aynı sürüm
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Migration testi: zincirin boş bir veritabanını baştan sona kurabildiğini doğrular
      - name: Run migrations on an empty database
        run: alembic upgrade head

      - name: Unit and API tests (pytest)
        run: pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint:ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
